[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [{"regex_pattern": "\\b\\d{1,5}\\b(?= in scoreboard slot)", "mask_with": "PID"}, {"regex_pattern": "\\berror state \\d+\\b", "mask_with": "NUM"}, {"regex_pattern": "\\bslot \\d+\\b", "mask_with": "NUM"}, {"regex_pattern": "\\[client \\d+\\.\\d+\\.\\d+\\.\\d+\\]", "mask_with": "IP"}]
mask_prefix = <
mask_suffix = >

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1024
extra_delimiters = ["_"]

[PROFILING]
enabled = True
report_sec = 30

