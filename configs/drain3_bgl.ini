[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[MASKING]
masking = [{"regex_pattern": "\\b(\\d{10})\\b", "mask_with": "TIMESTAMP"}, {"regex_pattern": "\\b(\\d{4})\\.(\\d{2})\\.(\\d{2})\\b", "mask_with": "DATE"}, {"regex_pattern": "\\b(\\d{2})\\.(\\d{2})\\.(\\d{2})\\b", "mask_with": "TIME"}, {"regex_pattern": "\\b(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)\\b", "mask_with": "IP"}, {"regex_pattern": "\\b(0x[0-9a-fA-F]+)\\b", "mask_with": "HEX"}, {"regex_pattern": "\\b(\\d+)\\s+(ddr|DDR|tree|torus|L3|EDRAM)\\s+error", "mask_with": "NUM"}, {"regex_pattern": "\\b(core\\.)\\d+\\b", "mask_with": "COREFILE"}, {"regex_pattern": "\\b(\\d+)\\s+(floating point|double-hummer|integer)\\s+alignment\\s+exceptions\\b", "mask_with": "NUM"}]
mask_prefix = <
mask_suffix = >

[DRAIN]
sim_th = 0.4
depth = 4
max_children = 100
max_clusters = 1024
extra_delimiters = ["_"]

[PROFILING]
enabled = True
report_sec = 30

